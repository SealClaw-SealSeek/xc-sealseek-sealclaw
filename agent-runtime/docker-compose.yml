version: '3.8'

volumes:
  sealclaw-data:
    name: sealclaw-data
  sealclaw-secrets:
    name: sealclaw-secrets

services:
  sealclaw:
    image: agentscope/sealclaw:latest
    container_name: sealclaw
    restart: always
    ports:
      - "127.0.0.1:8088:8088"
    # environment:
    #   - COPAW_AUTH_ENABLED=true
    #   - COPAW_AUTH_USERNAME=admin
    #   - COPAW_AUTH_PASSWORD=yourpassword
    volumes:
      - sealclaw-data:/app/working
      - sealclaw-secrets:/app/working.secret
