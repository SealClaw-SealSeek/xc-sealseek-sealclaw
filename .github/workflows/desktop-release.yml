# Build SealClaw Desktop: Tauri binary + conda-pack Python environment
# Windows: NSIS installer, macOS: .app bundle (.zip)
# 触发方式：手动触发用于校验构建；推送 v<desktop-semver> tag 用于正式发布。

name: SealClaw Desktop Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: agent-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace npm dependencies
        working-directory: .
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop-client/src-tauri -> target"

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"
          activate-environment: "sealclaw-build"
          condarc-file: agent-runtime/.github/condarc
          conda-remove-defaults: true

      - name: Sync desktop version
        id: version
        run: python scripts/sync_desktop_version.py --sync --github-output "$GITHUB_OUTPUT"

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          EXPECTED_TAG: v${{ steps.version.outputs.desktop_version }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match desktop version ${EXPECTED_TAG}"
            exit 1
          fi

      - name: Clean dist directory
        run: rm -rf dist && mkdir -p dist

      - name: Build macOS .app
        shell: bash -l {0}
        run: |
          chmod +x scripts/pack/build_macos.sh
          conda run -n sealclaw-build bash -c 'CREATE_ZIP=1 ./scripts/pack/build_macos.sh'

      - name: Sign macOS artifact with Tauri signer
        if: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/SealClaw-*.zip)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "::error::No macOS zip artifact found to sign"
            exit 1
          fi
          for f in "${artifacts[@]}"; do
            echo "Signing $f..."
            npx --yes @tauri-apps/cli signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$f"
            echo " -> $f.sig created"
          done

      - name: List dist (on failure)
        if: failure()
        run: |
          echo "=== dist contents ==="
          find dist -maxdepth 2 -type f | sort || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SealClaw-Desktop-macOS-${{ steps.version.outputs.desktop_version }}
          path: |
            agent-runtime/dist/SealClaw-*.zip
            agent-runtime/dist/SealClaw-*.zip.sig
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace npm dependencies
        working-directory: .
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop-client/src-tauri -> target"

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"
          activate-environment: "sealclaw-build"
          condarc-file: agent-runtime/.github/condarc
          conda-remove-defaults: true

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2

      - name: Sync desktop version
        id: version
        shell: pwsh
        run: python scripts/sync_desktop_version.py --sync --github-output $env:GITHUB_OUTPUT

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          EXPECTED_TAG: v${{ steps.version.outputs.desktop_version }}
        run: |
          if ($env:GITHUB_REF_NAME -ne $env:EXPECTED_TAG) {
            throw "Tag $env:GITHUB_REF_NAME does not match desktop version $env:EXPECTED_TAG"
          }

      - name: Clean dist directory
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item -Recurse -Force dist
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Build Windows installer
        shell: pwsh
        run: conda run -n sealclaw-build pwsh -File ./scripts/pack/build_win.ps1

      - name: Sign Windows artifact with Tauri signer
        if: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $artifacts = Get-ChildItem dist/SealClaw-Setup-*.exe -ErrorAction Stop
          foreach ($artifact in $artifacts) {
            Write-Host "Signing $artifact..."
            npx --yes @tauri-apps/cli signer sign --private-key $env:TAURI_SIGNING_PRIVATE_KEY --password $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD $artifact.FullName
            Write-Host " -> $($artifact.FullName).sig created"
          }

      - name: List dist (on failure)
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== dist contents ==="
          Get-ChildItem -Path dist -Recurse -Depth 2 -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SealClaw-Desktop-Windows-${{ steps.version.outputs.desktop_version }}
          path: |
            agent-runtime/dist/SealClaw-Setup-*.exe
            agent-runtime/dist/SealClaw-Setup-*.exe.sig
          if-no-files-found: error

  upload-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync desktop version
        id: version
        run: python3 agent-runtime/scripts/sync_desktop_version.py --sync --github-output "$GITHUB_OUTPUT"

      - name: Verify updater signing prerequisites
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for tag releases because updater metadata is published."
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Collect and verify artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob

          for source in SealClaw-Desktop-Windows-*/* SealClaw-Desktop-macOS-*/*; do
            [ -f "$source" ] || continue
            mv "$source" .
          done

          win_exes=(SealClaw-Setup-*.exe)
          win_sigs=(SealClaw-Setup-*.exe.sig)
          mac_zips=(SealClaw-*-macOS.zip)
          mac_sigs=(SealClaw-*-macOS.zip.sig)

          if [ ${#win_exes[@]} -ne 1 ]; then
            echo "::error::Expected exactly one Windows installer, found ${#win_exes[@]}"
            exit 1
          fi
          if [ ${#win_sigs[@]} -ne 1 ]; then
            echo "::error::Expected exactly one Windows signature file, found ${#win_sigs[@]}"
            exit 1
          fi
          if [ ${#mac_zips[@]} -ne 1 ]; then
            echo "::error::Expected exactly one macOS zip, found ${#mac_zips[@]}"
            exit 1
          fi
          if [ ${#mac_sigs[@]} -ne 1 ]; then
            echo "::error::Expected exactly one macOS signature file, found ${#mac_sigs[@]}"
            exit 1
          fi

          echo "WINDOWS_EXE=${win_exes[0]}" >> "$GITHUB_ENV"
          echo "WINDOWS_SIG=${win_sigs[0]}" >> "$GITHUB_ENV"
          echo "MAC_ZIP=${mac_zips[0]}" >> "$GITHUB_ENV"
          echo "MAC_SIG=${mac_sigs[0]}" >> "$GITHUB_ENV"

      - name: Generate update manifest (latest.json)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_TAG="v${{ steps.version.outputs.desktop_version }}"
          VERSION="${{ steps.version.outputs.desktop_version }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOTES="SealClaw Desktop ${VERSION}"

          if [ "${TAG}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag ${TAG} does not match desktop version ${EXPECTED_TAG}"
            exit 1
          fi

          WIN_SIG_CONTENT=$(tr -d '\r\n' < "${WINDOWS_SIG}")
          MAC_SIG_CONTENT=$(tr -d '\r\n' < "${MAC_SIG}")
          GH_BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          cat > latest.json <<MANIFEST
          {
            "version": "${VERSION}",
            "notes": "${NOTES}",
            "pub_date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "url": "${GH_BASE}/${MAC_ZIP}",
                "signature": "${MAC_SIG_CONTENT}"
              },
              "darwin-x86_64": {
                "url": "${GH_BASE}/${MAC_ZIP}",
                "signature": "${MAC_SIG_CONTENT}"
              },
              "windows-x86_64": {
                "url": "${GH_BASE}/${WINDOWS_EXE}",
                "signature": "${WIN_SIG_CONTENT}"
              }
            }
          }
          MANIFEST
          echo "Generated latest.json:"
          cat latest.json

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SealClaw-Setup-*.exe
            SealClaw-Setup-*.exe.sig
            SealClaw-*-macOS.zip
            SealClaw-*-macOS.zip.sig
            latest.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Gitee Release
        if: vars.GITEE_OWNER != '' && vars.GITEE_REPO != ''
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          RELEASE_ID=$(curl -s "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating Gitee release for tag $TAG..."
            RELEASE_ID=$(curl -s -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
              -H "Content-Type: application/json" \
              -d "{\"access_token\":\"${GITEE_TOKEN}\",\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"Auto-uploaded from GitHub Actions\"}" \
              | jq -r '.id')
          fi

          echo "Uploading to Gitee Release ID: $RELEASE_ID"
          for f in "${WINDOWS_EXE}" "${WINDOWS_SIG}" "${MAC_ZIP}" "${MAC_SIG}" latest.json; do
            echo "Uploading $f..."
            curl -s -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
              -H "Content-Type: multipart/form-data" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${f}"
            echo " -> done"
          done
